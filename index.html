
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;500&display=swap');

  #love-card {
    min-height: 540px;
    background: linear-gradient(160deg, #fff0f4 0%, #fff8f0 100%);
    border-radius: var(--border-radius-lg);
    border: 0.5px solid #f5c0d0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 2rem 2.5rem;
    text-align: center;
  }

  .petal {
    position: absolute;
    width: 14px;
    height: 18px;
    background: #f8a0b8;
    border-radius: 50% 10% 50% 10%;
    opacity: 0;
    animation: fall linear infinite;
    top: -30px;
    pointer-events: none;
  }

  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(580px) rotate(360deg); opacity: 0; }
  }

  .hearts-float {
    position: absolute;
    font-size: 18px;
    opacity: 0;
    animation: floatUp 3s ease-in infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    20%  { opacity: 0.9; }
    100% { transform: translateY(-130px) scale(1.2); opacity: 0; }
  }

  .big-emoji {
    font-size: 60px;
    animation: pulse 1.4s ease-in-out infinite;
    line-height: 1;
    margin-bottom: 0.4rem;
    transition: opacity 0.3s;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.1); }
  }

  .title {
    font-family: 'Dancing Script', cursive;
    font-size: 34px;
    color: #c0395e;
    margin: 0.4rem 0 0.8rem;
    line-height: 1.2;
  }

  .message {
    font-family: 'Dancing Script', cursive;
    font-size: 19px;
    color: #7a2040;
    max-width: 420px;
    line-height: 1.85;
    min-height: 130px;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #c0395e;
    vertical-align: middle;
    animation: blink 0.8s step-end infinite;
    margin-left: 2px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .msg-counter {
    font-size: 12px;
    color: #d48090;
    margin-top: 0.5rem;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 1.2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-love {
    background: #e84076;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 26px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .btn-love:hover { background: #c0395e; transform: scale(1.05); }
  .btn-love:disabled { opacity: 0.5; cursor: default; transform: none; }

  .tag {
    background: #ffd6e4;
    color: #a02850;
    font-size: 12px;
    border-radius: 999px;
    padding: 4px 16px;
    font-weight: 500;
    margin-bottom: 0.6rem;
    display: inline-block;
    font-family: 'Inter', sans-serif;
  }
</style>

<div id="love-card">
  <div id="petals-container"></div>

  <span class="tag">✦ Dia dos Namorados ✦</span>

  <div class="big-emoji" id="card-emoji">🌹</div>

  <div class="title">Para o amor da minha vida</div>

  <div class="message" id="typed-msg"><span class="cursor"></span></div>

  <div class="msg-counter" id="msg-counter"></div>

  <div class="btn-row">
    <button class="btn-love" id="btn-next" onclick="nextMessage()">♡ Proxima mensagem</button>
  </div>
</div>

  },
  {

  },
  {
    emoji: "🌹",
    texto: "O que mais gosto em nós é que a gente não precisa de nada grandioso pra ser feliz. Só a sua presença já é o suficiente."
  },
  {
    emoji: "🌹",
    texto: "Cada plano que faço, faço pensando em você. Você já é parte de tudo que imagino pro futuro."
  },
  {
    emoji: "🌹",
    texto: "Você chegou na minha vida e reorganizou tudo do melhor jeito possível. Com você tudo faz mais sentido."
  },
  {
    emoji: "🌹",
    texto: "Tenho orgulho de quem você é. Da sua força, da sua bondade, do seu coração. Sou apaixonado por você inteiro."
  },
  {
    emoji: "🌹",
    texto: "Nem nos meus melhores sonhos eu teria imaginado alguém tão certo pra mim. E aí você apareceu. Te amo demais."
  },
  {
    emoji: "🌹",
    texto: "A vida tem ficado mais bonita desde que você está nela. Obrigado por cada dia, cada abraço, cada momento nosso."
  },
  {
    emoji: "🌹",
    texto: "Você é a pessoa com quem eu quero dividir as novidades primeiro, os medos também, e tudo mais que vier. Feliz Dia dos Namorados."
  },

  {
    emoji: "🌹",
    texto: "Você é a pessoa que eu escolho todos os dias. Com alegria, com certeza e com muito amor."
  }
];

let atual = -1;
let typingTimer = null;
let seen = [];

function proximoIndex() {
  if (seen.length === mensagens.length) seen = [];
  let opcoes = mensagens.map((_, i) => i).filter(i => !seen.includes(i));
  if (atual !== -1) opcoes = opcoes.filter(i => i !== atual);
  const idx = opcoes[Math.floor(Math.random() * opcoes.length)];
  seen.push(idx);
  return idx;
}

function nextMessage() {
  clearTimeout(typingTimer);
  const btn = document.getElementById('btn-next');
  btn.disabled = true;

  atual = proximoIndex();
  const msg = mensagens[atual];

  const el = document.getElementById('typed-msg');
  el.innerHTML = '<span class="cursor"></span>';

  document.getElementById('msg-counter').textContent = 'mensagem ' + seen.length + ' de ' + mensagens.length;

  let i = 0;
  const texto = msg.texto;
  function type() {
    if (i <= texto.length) {
      el.innerHTML = texto.slice(0, i) + '<span class="cursor"></span>';
      i++;
      typingTimer = setTimeout(type, 36);
    } else {
      btn.disabled = false;
    }
  }
  setTimeout(type, 200);
}

function createPetals() {
  const container = document.getElementById('petals-container');
  const colors = ['#f8a0b8','#f4bfcc','#fcd1e0','#f083a0','#fde8ef'];
  for (let p = 0; p < 18; p++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + '%';
    petal.style.animationDuration = (4 + Math.random() * 5) + 's';
    petal.style.animationDelay = (Math.random() * 7) + 's';
    petal.style.background = colors[Math.floor(Math.random() * colors.length)];
    petal.style.transform = 'rotate(' + (Math.random()*60-30) + 'deg)';
    container.appendChild(petal);
  }
}

function spawnHeart() {
  const card = document.getElementById('love-card');
  const h = document.createElement('div');
  h.className = 'hearts-float';
  h.textContent = ['💖','💕','💗','🌸','💝'][Math.floor(Math.random()*5)];
  h.style.left = (15 + Math.random() * 70) + '%';
  h.style.bottom = '70px';
  card.appendChild(h);
  setTimeout(() => h.remove(), 3000);
}

createPetals();
nextMessage();
setInterval(spawnHeart, 2400);
</script>
